name: Build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_PATH: src/CloudQuake/CloudQuake.csproj

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "ga"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            # Untagged builds get a pre-release version stamped with the short SHA.
            $version = "0.0.0-dev.$($env:GITHUB_SHA.Substring(0,7))"
          }
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "Building version $version"

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: >
          dotnet build ${{ env.PROJECT_PATH }} -c Release --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          -warnaserror

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish ${{ env.PROJECT_PATH }} -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: CloudQuake-win-x64
          path: publish/CloudQuake.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: CloudQuake-win-x64
          path: publish

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/CloudQuake.exe
          generate_release_notes: true
          draft: false
